<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWBO LAMMC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%232f8a4f%27 d=%27M12%2021.35l-1.45-1.32C5.4%2015.36%202%2012.28%202%208.5%202%205.42%204.42%203%207.5%203c1.74%200%203.41.81%204.5%202.09C13.09%203.81%2014.76%203%2016.5%203%2019.58%203%2022%205.42%2022%208.5c0%203.78-3.4%206.86-8.55%2011.54L12%2021.35z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --line:#e3e1da; --ink:#1f2421; --muted:#6b706c;
  --accent:#2f6b4f; --accent-soft:#e3efe8; --warn:#b4532a;
  --radius:8px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f7f7f4;border-color:#cfccc2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#285c44}
.btn.icon{padding:5px 8px;min-width:30px;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}

/* top bar */
#top{height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .logo{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;margin-right:6px}
#top .brand{display:flex;align-items:center;gap:9px;margin-right:6px;min-width:0;max-width:440px;flex:0 1 auto}
#top .brand .crest{height:42px;width:auto;flex:none;image-rendering:auto}
#top .brand .bt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
#top .brand .bn{font-weight:700;color:var(--accent);font-size:16px;letter-spacing:.02em;white-space:nowrap}
#top .brand .lm{font-weight:500;opacity:.8}
#top .brand .bs{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand .bs b{color:var(--accent);font-weight:600}
.es-brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.es-brand img{width:100%;max-width:330px;height:auto;display:block;margin:0 auto 10px}
.es-brand .inst{font-weight:600;color:var(--accent);letter-spacing:.06em;font-size:13px}
.es-brand .dept{color:var(--ink);font-size:13px;margin-top:2px}
#title{flex:1;min-width:120px;max-width:460px;border:1px solid transparent;border-radius:6px;padding:5px 8px;font:500 15px Inter,sans-serif;background:transparent}
#title:hover,#title:focus{border-color:var(--line);outline:none;background:#fff}
#status{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
#langSel{border:1px solid var(--line);border-radius:6px;padding:4px 4px;font:12px Inter,sans-serif;background:#fff;color:var(--muted);flex:none}
#cloudBadge{display:none;font-size:16px;line-height:1;cursor:default}

/* layout */
#main{position:absolute;top:50px;bottom:0;left:0;right:0;display:flex}
#left{width:50%;min-width:280px;display:flex;flex-direction:column}
#right{flex:1;min-width:280px;display:flex;flex-direction:column;position:relative;background:#e9e8e3}
#split{width:6px;cursor:col-resize;background:var(--line);flex:none}
#split:hover,#split.drag{background:var(--accent)}
.bar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px}

/* editor */
#edWrap{flex:1;display:flex;min-height:0}
#parts{width:max-content;min-width:104px;max-width:190px;flex:none;background:#fbfaf7;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
body.noparts #parts{display:none}
.pth{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px 8px 10px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#partList{overflow:auto;flex:1;padding:0 4px 12px}
.part{display:flex;align-items:flex-start;gap:5px;padding:6px 6px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.3;position:relative}
.part:hover{background:#efeee8}
.part.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.part .pn{color:var(--muted);font-size:11px;min-width:14px;padding-top:1px}
.part .pt{flex:1;word-break:break-word}
.part .pt.untitled{color:#999;font-style:italic}
.part .pc{font-size:10.5px;color:var(--muted);display:block;font-weight:400;margin-top:2px}
.part .pa{display:none;gap:2px;margin-top:4px}
.part:hover .pa,.part.on .pa{display:flex}
.part .pa button{border:0;background:#fff;border-radius:4px;font-size:11px;padding:2px 5px;color:var(--muted);box-shadow:0 0 0 1px var(--line)}
.part .pa button:hover{color:var(--ink)}
#edScroll{flex:1;overflow:auto;padding:16px 16px 80px}
#pageWrap{max-width:794px;margin:0 auto}
#partTitle{display:block;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;margin-bottom:8px;font:600 17px Inter,sans-serif;color:var(--ink)}
#partTitle:hover,#partTitle:focus{border-color:var(--line);background:#fff;outline:none}
#sheetBox{position:relative}
#noteLayer{position:absolute;inset:0;pointer-events:none;z-index:5}
body.nonotes #noteLayer{display:none}
body.nonotes mark.note{border-bottom-color:transparent;background:transparent}
mark.note{background:rgba(255,214,64,calc(.18 * var(--hlk,1)));border-bottom:2px dotted color-mix(in srgb,#e0a800 calc(35% + 65% * var(--hlk,1)),transparent);color:inherit;cursor:pointer;padding:0}
mark.note.open{background:rgba(255,214,64,calc(.15 + .3 * var(--hlk,1)))}
.note-pin{display:inline-block;width:0;height:1em;vertical-align:text-bottom}
.npin{position:absolute;width:22px;height:22px;border-radius:5px;background:var(--nc,#ffe27a);box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transform:rotate(-3deg);transition:transform .1s}
.npin:hover{transform:rotate(0) scale(1.12)}
.nbub{position:absolute;width:250px;background:var(--nc,#fff3a8);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.15);pointer-events:auto;display:flex;flex-direction:column;font:13px/1.4 Inter,sans-serif}
.nbub .nh{display:flex;align-items:center;gap:4px;padding:5px 6px 3px 8px;cursor:move;user-select:none;font-size:11px;color:rgba(0,0,0,.5)}
.nbub .nh .ncol{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0}
.nbub .nh .sp{flex:1}
.nbub .nh button.nb{border:0;background:none;color:rgba(0,0,0,.5);font-size:13px;padding:0 4px;cursor:pointer}
.nbub .nh button.nb:hover{color:#000}
.nbub .nh button.ndel{font-size:11px;font-weight:600;color:#a33;border:1px solid rgba(160,50,50,.35);border-radius:4px;padding:1px 6px;margin-right:2px}
.nbub .nh button.ndel:hover{background:#a33;color:#fff}
.nbub textarea{border:0;background:transparent;resize:none;min-height:110px;padding:2px 10px 10px;font:inherit;color:#222;outline:none}
#noteList{overflow:auto;max-height:35%;padding:0 4px 10px;width:0;min-width:100%;box-sizing:border-box}
.nli{display:flex;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1.3}
.nli:hover{background:#efeee8}
.nli .sq{width:10px;height:10px;border-radius:2px;background:var(--nc,#ffe27a);flex:none;margin-top:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.nli .tx{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nli .wh{display:block;font-size:10.5px;color:var(--muted)}
#sheets{display:none;position:absolute;inset:0;pointer-events:none}
.sheet{position:absolute;left:0;width:210mm;height:297mm;background:#fff;box-shadow:var(--shadow)}
.sheet .sn{position:absolute;bottom:var(--snb,1.5mm);left:0;right:0;text-align:center;font:10px Inter,sans-serif;color:#aaa}
body.a4 #pageWrap{max-width:none;width:210mm}
body.a4 #sheets{display:block}
body.a4 #editor{max-width:none;width:210mm;min-height:297mm;background:transparent;box-shadow:none;padding:var(--mt,5mm) var(--mr,5mm) var(--mb,5mm) var(--ml,5mm);position:relative}
#editor{max-width:794px;min-height:1000px;margin:0 auto;background:#fff;box-shadow:var(--shadow);padding:72px 64px;outline:none;
  font:12pt/1.5 "Times New Roman","PT Serif",serif;color:#111;word-wrap:break-word}
#editor{font-family:var(--docfont,"Times New Roman"),"PT Serif","Liberation Serif",serif}
#editor.f-arial{font-family:Arial,"Liberation Sans",Helvetica,sans-serif}
#editor p{margin:0 0 6pt}
#editor p.caption{font-size:10pt;margin:2pt 0 8pt}
#editor h1{font-weight:bold}#editor h2{font-weight:bold}
#editor h1{font-size:16pt;margin:12pt 0 8pt}#editor h2{font-size:14pt;margin:12pt 0 6pt}#editor h3{font-size:12pt;margin:10pt 0 6pt}
#editor table{border-collapse:collapse;margin:6pt 0}#editor td,#editor th{border:1px solid #999;padding:3px 6px;vertical-align:top}
#editor img{max-width:100%}
#editor.empty::before{content:attr(data-ph);color:#aaa;position:absolute;pointer-events:none}
mark.cite{background:color-mix(in srgb,var(--c,#e8b931) calc(22% * var(--hlk,1)),transparent);border-bottom:2px solid color-mix(in srgb,var(--c,#e8b931) calc(35% + 65% * var(--hlk,1)),transparent);color:inherit;cursor:pointer;border-radius:2px;padding:0}
mark.cite:hover{background:color-mix(in srgb,var(--c,#e8b931) calc(10% + 28% * var(--hlk,1)),transparent)}
mark.cite.active{background:color-mix(in srgb,var(--c,#e8b931) calc(20% + 35% * var(--hlk,1)),transparent);box-shadow:0 0 0 1px var(--c,#e8b931)}
mark.cite.pending{--c:#888;background:#eee;border-bottom:2px dashed #666}
mark.cite.orphan{--c:#bbb}
mark.cite.trashed{background:none;border-bottom:0;cursor:text}
.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{filter:brightness(.75);outline:3px solid rgba(47,107,79,.5)}}

/* viewer */
#viewer{flex:1;overflow:auto;position:relative;padding:16px 0 80px}
.pdfpage{position:relative;margin:0 auto 14px;background:#fff;box-shadow:var(--shadow)}
.pdfpage canvas{position:absolute;inset:0;display:block}
body.area #viewer .textLayer{pointer-events:none}
body.area #viewer .pdfpage{cursor:crosshair;touch-action:none;user-select:none}
#bArea.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.areaEdit{position:absolute;border:2px solid var(--accent);background:rgba(47,107,79,.10);z-index:7;cursor:move;touch-action:none;box-shadow:0 0 0 2000px rgba(0,0,0,.06)}
.areaEdit i{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:3px}
.areaEdit i[data-h=nw]{left:-7px;top:-7px;cursor:nwse-resize}.areaEdit i[data-h=ne]{right:-7px;top:-7px;cursor:nesw-resize}
.areaEdit i[data-h=sw]{left:-7px;bottom:-7px;cursor:nesw-resize}.areaEdit i[data-h=se]{right:-7px;bottom:-7px;cursor:nwse-resize}
.areaEdit i[data-h=n]{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.areaEdit i[data-h=s]{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}
.areaEdit i[data-h=w]{top:calc(50% - 6px);left:-7px;cursor:ew-resize}.areaEdit i[data-h=e]{top:calc(50% - 6px);right:-7px;cursor:ew-resize}
#areaEditBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:66;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;display:none;align-items:center;gap:8px;font-size:13px;max-width:94vw}
#areaEditBar.show{display:flex}
.areaBox{position:absolute;border:2px dashed var(--accent);background:rgba(47,107,79,.12);z-index:6;pointer-events:none}
.pdfpage .pnum{position:absolute;right:-2px;top:-14px;font-size:10px;color:var(--muted)}
.hl{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c,#e8b931) calc(60% * (1 - var(--hlk,1))),transparent)}
#hlPop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;display:none;font-size:13px;width:230px}
#hlPop.show{display:block}
#hlPop .row{display:flex;align-items:center;gap:8px;margin-top:6px}
#hlPop input{flex:1;accent-color:var(--accent)}
#hlPop .pv{display:flex;gap:6px;margin-top:8px}
#hlPop .pv button{flex:1}
.hl-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
.hl{position:absolute;background:color-mix(in srgb,var(--c,#e8b931) calc(30% * var(--hlk,1)),transparent);mix-blend-mode:multiply;border-radius:2px}
.hl.active{background:color-mix(in srgb,var(--c,#e8b931) calc(20% + 40% * var(--hlk,1)),transparent);outline:2px solid var(--c,#e8b931)}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(0,90,255,.3)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}
#srcSel{max-width:240px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;background:#fff}
#zoomVal{min-width:44px;text-align:center;color:var(--muted);font-size:12px}
.empty-state{max-width:460px;margin:60px auto;padding:28px;background:#fff;border-radius:12px;box-shadow:var(--shadow);color:var(--muted);line-height:1.55}
.empty-state h3{margin:0 0 10px;color:var(--ink);font-weight:600}
.empty-state ol{padding-left:20px;margin:10px 0 18px}
.empty-state b{color:var(--ink)}
#right.dragover::after{content:attr(data-drop);position:absolute;inset:8px;border:3px dashed var(--accent);border-radius:12px;background:rgba(47,107,79,.08);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);z-index:30}

/* info card */
#info{display:none;margin:8px 10px 0;padding:10px 12px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--c,#e8b931)}
#info.show{display:block}
#info .h{display:flex;align-items:center;gap:8px;font-weight:600}
#info .q{margin:6px 0 8px;color:#333;font:13px/1.45 "PT Serif",serif;max-height:4.4em;overflow:auto}
#info .acts{display:flex;gap:6px;flex-wrap:wrap}
#info .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--muted)}

/* links panel */
#linksPanel{position:absolute;top:44px;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.08);z-index:20;display:none;flex-direction:column}
#linksPanel.show{display:flex}
#helpBtn,#newsBtn{position:relative;flex:none;width:30px;height:28px;min-width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:#fff;border:1px solid var(--line);border-radius:7px;margin-right:6px;cursor:pointer}
#helpBtn:hover,#newsBtn:hover{background:var(--accent-soft,#eef5f0)}
#helpBtn svg,#newsBtn svg{display:block}
#helpBox a.btn{text-decoration:none}
#helpBox .mail{font-weight:600;color:var(--accent);word-break:break-all}
#newsBtn.dot::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#e5533d;border:1.5px solid #fff}
#newsPanel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 22px rgba(0,0,0,.12);z-index:65;display:none;flex-direction:column}
#newsPanel.show{display:flex}
#newsPanel .ph{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
#newsBody{overflow:auto;padding:6px 16px 20px}
#newsBody h4{margin:16px 0 6px;font-size:13px;color:var(--accent)}
#newsBody ul{margin:0;padding-left:18px}
#newsBody li{margin:4px 0;font-size:13px;line-height:1.45}
#libPanel{position:absolute;top:44px;left:0;bottom:0;width:min(400px,100%);background:#fff;border-right:1px solid var(--line);box-shadow:6px 0 18px rgba(0,0,0,.08);z-index:21;display:none;flex-direction:column}
#libPanel.show{display:flex}
#libPanel .ph{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.libtools{padding:8px 12px;border-bottom:1px solid var(--line)}
#libSearch{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
#folderInfo{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#folderInfo .btn{padding:2px 8px;font-size:12px}
#libList{overflow:auto;flex:1}
.lib{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid #f0efea;cursor:pointer}
.lib:hover{background:#f7f7f3}
.lib.on{background:var(--accent-soft)}
.lib .dot{margin-top:4px}
.lib .nm{font-weight:500;word-break:break-word}
.lib .fn{font-size:11.5px;color:var(--muted);word-break:break-all}
.lib .lc{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.lib.missing .nm{color:#999}
.libf{display:flex;gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lgh{display:flex;align-items:center;gap:6px;padding:9px 12px 5px;font-size:12px;font-weight:600;color:var(--ink);background:#f7f6f2;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.lgh .pbar{flex:1;height:4px;border-radius:2px;background:#e4e2db;overflow:hidden;margin-left:6px;max-width:90px}
.lgh .pbar i{display:block;height:100%;background:var(--accent)}
.lgh .ct{font-weight:500;color:var(--muted);white-space:nowrap}
.lib.uncited{opacity:.55}
.lib.uncited:hover{opacity:.85}
.lib .cb{margin-left:auto;font-size:11px;white-space:nowrap;border-radius:10px;padding:1px 7px;align-self:flex-start}
.lib .cb.yes{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lib .cb.no{color:#999;border:1px dashed #ccc}
#linksPanel .ph{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
#linksList{overflow:auto;flex:1;padding:6px 0}
.lgroup{padding:8px 12px 2px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.litem{padding:8px 12px;border-bottom:1px solid #f0efea;cursor:pointer;display:flex;gap:8px}
.litem:hover{background:#f7f7f3}
.litem .body{flex:1;min-width:0}
.litem .ph2{font:13px/1.35 "PT Serif",serif;color:#111}
.litem .lq{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.litem .del{border:0;background:none;color:#aaa;font-size:15px;align-self:flex-start}
.litem .del:hover{color:var(--warn)}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:#fbeee6;color:var(--warn)}

/* popup, pending, toast, modal */
#popup{position:fixed;z-index:50;display:none;background:#1f2421;color:#fff;border-radius:8px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.25);gap:2px;flex-direction:column}
#popup.show{display:flex}
#popup button{border:0;background:transparent;color:#fff;text-align:left;padding:7px 10px;border-radius:5px;white-space:nowrap}
#popup button:hover{background:rgba(255,255,255,.14)}
#popup .tip{padding:8px 10px 4px;max-width:min(340px,86vw);white-space:normal}
#popup .tt{font-weight:600;display:flex;align-items:center;gap:6px}
#popup .tq{font:13px/1.45 'PT Serif',serif;margin:6px 0 4px;max-height:40vh;overflow:auto}
#popup .tn{font-size:11px;color:#b9c2bd}
#popup .sub{font-size:11px;color:#b9c2bd;padding:2px 10px 4px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pending{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#1f2421;color:#fff;padding:9px 10px 9px 16px;border-radius:30px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
#pending.show{display:flex}
#pending span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pending button{border:0;border-radius:20px;padding:5px 12px;background:rgba(255,255,255,.15);color:#fff}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1f2421;color:#fff;padding:8px 14px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#modalBg{position:fixed;inset:0;background:rgba(20,24,22,.35);z-index:70;display:none;align-items:center;justify-content:center}
#modalBg.show{display:flex}
#modal{background:#fff;border-radius:12px;padding:20px 22px;width:min(460px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal{position:relative}
#modalBg.clear{background:transparent;pointer-events:none}
#modalBg.clear #modal{pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#modal h3{margin:0 0 10px;font-size:16px;cursor:move;user-select:none;touch-action:none}
#modal h3::after{content:'⠿';float:right;color:#bbb;font-weight:400}
#modal .mb{color:#444;line-height:1.5}
#modal .mg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
#modal .mg label{display:flex;flex-direction:column;gap:3px;margin:0;font-size:12px;color:var(--muted)}
#modal .mg input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
#modal input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-top:8px}
#modal label{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
#modal .mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#fontSel,#sizeSel{border:1px solid var(--line);border-radius:6px;padding:5px 4px;font:13px Inter,sans-serif;background:#fff;flex:none}
#fontSel{width:158px}
#marginSel{border:1px solid var(--line);border-radius:6px;padding:5px 4px;font:13px Inter,sans-serif;background:#fff;flex:none;width:150px}#sizeSel{width:58px}
.sty{position:relative;flex:none}
#bStyle{min-width:132px;justify-content:space-between}
#styleMenu{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;width:260px}
#styleMenu.show{display:block}
#styleMenu .si{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:8px 10px;cursor:pointer;color:#111;line-height:1.25}
#styleMenu .si:hover{background:#f2f1ec}
#styleMenu .si.on{background:var(--accent-soft)}
#styleMenu .si small{display:block;font:11px Inter,sans-serif;color:var(--muted);margin-top:2px}
.opt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:6px;cursor:pointer;user-select:none}
.hidden{display:none!important}

#actions{display:flex;align-items:center;gap:8px}
#bMenu,#tabs,#bRead{display:none}
@media (max-width: 820px){
  #top{gap:6px;padding:0 8px}
  #top .brand{max-width:none;flex:none}
  #top .brand .bs{display:none}
  #top .brand .crest{height:36px}
  #title{min-width:0;font-size:14px}
  #status{display:none}
  #bMenu{display:inline-flex}
  #bRead{display:inline-flex}
  body.reading #edBar > :not(#bRead){display:none}
  body.reading #bRead{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  body.reading #editor{font-size:13pt;line-height:1.6}
  #cloudBadge.on{display:inline;margin-left:auto}
  #actions{display:none;position:fixed;top:54px;right:8px;z-index:45;flex-direction:column;align-items:stretch;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:8px;gap:6px;min-width:200px}
  #actions.open{display:flex}
  #actions .sep{display:none}
  #actions .btn{justify-content:flex-start;padding:10px 12px}
  #main{bottom:56px}
  #split{display:none}
  #left,#right{width:100%!important;min-width:0}
  body:not(.tab-src) #right{display:none}
  body.tab-src #left{display:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bar .btn{flex:none}
  .opt{flex:none}
  #edScroll{padding:8px 6px 90px}
  #edWrap{flex-direction:column}
  #parts{width:auto;min-width:0;max-width:none;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center}
  #noteList{display:none}
  body.a4 #pageWrap,#pageWrap{width:auto;max-width:none;zoom:1!important}
  body.a4 #sheets{display:none}
  body.a4 #editor{width:auto;max-width:none;min-height:70vh;background:#fff;box-shadow:var(--shadow);padding:28px 20px}
  body.a4 #editor [data-pb]{margin-top:0!important}
  #partTitle{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #parts .pth{display:none}
  #partList{display:flex;gap:4px;overflow-x:auto;padding:6px}
  .part{flex:none;max-width:60vw;background:#fff;box-shadow:0 0 0 1px var(--line)}
  .part .pc,.part .pa{display:none!important}
  #bA4,#bParts{display:none!important}
  body.reading #partTitle{pointer-events:none}
  body.reading #partTitle:placeholder-shown{display:none}
  #editor{padding:28px 20px;min-height:70vh;font-size:12pt}
  #viewer{padding:8px 0 90px}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid var(--line);z-index:35;padding-bottom:env(safe-area-inset-bottom)}
  #tabs button{flex:1;border:0;background:none;font-weight:500;color:var(--muted);font-size:14px}
  #tabs button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
  #pending{bottom:68px;border-radius:14px;flex-wrap:wrap}
  #pending span{white-space:normal}
  #popup button{padding:11px 12px}
  #linksPanel{width:100%}
  .empty-state{margin:16px 10px;padding:20px}
}
#printRoot{display:none}
@media print {
  html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
  body.printing > *:not(#printRoot) { display: none !important; }
  body.printing #printRoot { display: block; font: 12pt/1.5 "Times New Roman", "PT Serif", serif; color: #000; }
  #printRoot.f-arial { font-family: Arial, "Liberation Sans", Helvetica, sans-serif !important; }
  #printRoot p { margin: 0 0 6pt; orphans: 3; widows: 3; }
  #printRoot p.caption { font-size: 10pt; }
  #printRoot h1 { font-size: 16pt; font-weight: bold; margin: 12pt 0 8pt; break-after: avoid; }
  #printRoot h2, #printRoot h3 { font-size: 14pt; font-weight: bold; margin: 12pt 0 6pt; break-after: avoid; }
  #printRoot section.pb { break-before: page; }
  #printRoot table { border-collapse: collapse; } #printRoot td, #printRoot th { border: 1px solid #999; padding: 3px 6px; }
  #printRoot img { max-width: 100%; }
  #printRoot sup.srcn { font-size: 8pt; color: #333; }
  #printRoot .srclist { margin-top: 18pt; font-size: 10pt; }
  #printRoot .srclist li { margin-bottom: 4pt; }
}
</style>

/* ---------------- downloads (platform capability, with plain fallback) ---------------- */
const downloadsReady = (async () => {
  try { if (window.claude && typeof window.claude.use === 'function') return await window.claude.use('downloads'); } catch (e) {}
  return null;
})();
async function saveFile(name, data) {
  const api = await downloadsReady;
  if (api) {
    try { await api.save({ filename: name, data }); toast('File saved'); }
    catch (err) {
      if (err && err.code === 'declined') toast('Save cancelled');
      else toast('Could not save the file' + (err && err.message ? ': ' + err.message : ''));
    }
    return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('Downloads are not available in this window'); }
}

/* ---------------- IndexedDB autosave (best effort) ---------------- */
let idb = null;
function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('citelink', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('pdfs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbReq(store, mode, fn) {
  if (!idb) return Promise.resolve(undefined);
  return new Promise(res => {
    try {
      const tx = idb.transaction(store, mode); const st = tx.objectStore(store); const rq = fn(st);
      tx.oncomplete = () => res(rq && 'result' in rq ? rq.result : true);
      tx.onerror = tx.onabort = () => res(undefined);
    } catch (e) { res(undefined); }
  });
}
const idbPut = (s, k, v) => idbReq(s, 'readwrite', st => st.put(v, k));
const idbGet = (s, k) => idbReq(s, 'readonly', st => st.get(k));
const idbDel = (s, k) => idbReq(s, 'readwrite', st => st.delete(k));
const idbClear = s => idbReq(s, 'readwrite', st => st.clear());

let saveTimer = null;
let localUpdatedAt = 0;
addEventListener('pagehide', () => { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveLocal(); } });
function scheduleSave() {
  localUpdatedAt = Date.now();
  if (cloud.on && !cloud.applying) { cloud.dirty = true; schedulePush(); }
  setStatus(cloud.on ? '' : 'Unsaved changes…');
  clearTimeout(saveTimer); saveTimer = setTimeout(saveLocal, 700);
}
async function saveLocal() {
  const data = projectData();
  const ok = await idbPut('kv', 'project', data);
  await saveSyncState();
  if (cloud.on) showSync();
  else setStatus(ok ? 'Saved in browser · ' + wordCount() : 'Autosave unavailable — save the project to a file');
}
function projectData() {
  storeCurrentPart();
  return { app: 'citelink', v: 2, title: state.title, parts: state.parts, currentPart: state.currentPart, font: state.font, margins: state.margins, saveOpts: state.saveOpts, trash: state.trash, sources: state.sources, links: state.links, notes: state.notes, folder: state.folder, zoom: state.zoom, insertCite: state.insertCite, cloudPdfs: !!state.cloudPdfs, activeSource: state.activeSource };
}

/* ---------------- UI helpers ---------------- */
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = W(t); el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }

function modal({ title, body = '', input = null, okText = 'OK', cancelText = 'Cancel', danger = false, clear = false }) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<h3>${esc(title)}</h3><div class="mb">${W(body)}</div>` +
      (input !== null ? `<input type="text" id="mInput" value="${esc(input)}">` : '') +
      `<div class="mf">${cancelText ? `<button class="btn" id="mCancel">${esc(cancelText)}</button>` : ''}<button class="btn primary" id="mOk" ${danger ? 'style="background:#b4532a;border-color:#b4532a"' : ''}>${esc(okText)}</button></div>`;
    $('#modalBg').classList.toggle('clear', clear); $('#modalBg').classList.add('show'); m.style.left = m.style.top = '0px';
    const h3 = m.querySelector('h3');
    h3.title = T('Drag to move');
    h3.onpointerdown = e => {
      e.preventDefault(); h3.setPointerCapture(e.pointerId);
      const sx = e.clientX - parseFloat(m.style.left), sy = e.clientY - parseFloat(m.style.top);
      h3.onpointermove = ev => { m.style.left = (ev.clientX - sx) + 'px'; m.style.top = (ev.clientY - sy) + 'px'; };
      h3.onpointerup = () => { h3.onpointermove = h3.onpointerup = null; };
    };
    const inp = $('#mInput'); if (inp) { inp.focus(); inp.select(); } else $('#mOk').focus();
    const close = v => { $('#modalBg').classList.remove('show'); document.removeEventListener('keydown', kd, true); res(v); };
    const collect = () => {
      const out = { ok: true, value: inp ? inp.value : null };
      m.querySelectorAll('input[type=checkbox]').forEach(c => out[c.name] = c.checked);
      m.querySelectorAll('input[type=number]').forEach(c => out[c.name] = parseFloat(c.value));
      return out;
    };
    const kd = e => { if (e.key === 'Escape') { e.stopPropagation(); close(false); } if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); close(collect()); } };
    document.addEventListener('keydown', kd, true);
    $('#mOk').onclick = () => close(collect());
    if ($('#mCancel')) $('#mCancel').onclick = () => close(false);
  });
}

function nextColor() { return COLORS[state.sources.length % COLORS.length]; }

async function addPdfFiles(files) {
  let lastId = null;
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') continue;
    const dup = state.sources.find(x => (x.name || '').toLowerCase() === f.name.toLowerCase());

// entries: [{name, rel, file?}] — add new PDFs as sources, re-attach missing ones by file name
async function syncFolder(entries) {
  setStatus('Reading folder…');
  let added = 0, relinked = 0, restored = 0, firstNew = null;
  const relsNow = new Set(entries.filter(en => isPdfName(en.name)).map(en => en.rel).filter(Boolean));
  // the same PDF may sit in several subfolders: remember every place, keep one source
  state.sources.forEach(x => { if (x.also) { x.also = x.also.filter(r => relsNow.has(r) && r !== x.rel); if (!x.also.length) delete x.also; } });
  for (const en of entries) {
    if (!isPdfName(en.name)) continue;
    if (state.sources.some(x => x.also && x.also.includes(en.rel))) continue;
    let s = state.sources.find(x => x.rel && x.rel === en.rel) || state.sources.find(x => (x.name || '').toLowerCase() === en.name.toLowerCase());
    if (s && en.rel && s.rel && s.rel !== en.rel && relsNow.has(s.rel)) {
      s.also = [...new Set([...(s.also || []), en.rel])];
      continue;
    }
    if (s) {
      const had = pdfBuffers.has(s.id) || (!s.disk && await idbGet('pdfs', s.id));
      s.rel = en.rel;
      if (DESK || en.fh) { const was = s.disk; if (!was && en.fh) idbDel('pdfs', s.id); s.disk = true; if (!had && !was) relinked++; }
      else if (!had && en.file) { const b = await en.file.arrayBuffer(); pdfBuffers.set(s.id, b); await idbPut('pdfs', s.id, b); s.disk = false; relinked++; }
      continue;
    }
    const tr = (state.trash || []).find(t => (t.source.rel && t.source.rel === en.rel) || (t.source.name || '').toLowerCase() === en.name.toLowerCase());
    if (tr) {
      s = { ...tr.source, rel: en.rel, disk: !!(DESK || en.fh) };
      state.sources.push(s); state.links.push(...tr.links.filter(l => !linkById(l.id)));
      state.trash = state.trash.filter(t => t !== tr);

      restored++; continue;
    }
    const id = uid('S');
    s = { id, name: en.name, rel: en.rel, label: en.name.replace(/\.pdf$/i, ''), color: nextColor(), disk: !!(DESK || en.fh) };
    if (!DESK && en.file) { const b = await en.file.arrayBuffer(); await idbPut('pdfs', id, b); }

}

const SEPARATE = 'Added separately';

// get a source's PDF bytes: memory → browser storage → linked folder on disk (Windows app)
async function loadBuffer(id) {
  if (pdfBuffers.has(id)) return pdfBuffers.get(id);
  const s = srcById(id); if (!s) return null;
  if (!s.disk) { const b = await idbGet('pdfs', id); if (b) { pdfBuffers.set(id, b); return b; } }
  if (s.asset && !DESK) {
    try {
      setStatus('Downloading “' + s.label + '” from the cloud…');
      const r = await fetch('/_blob/' + s.asset);
      if (r.ok) { const b = await r.arrayBuffer(); pdfBuffers.set(id, b); idbPut('pdfs', id, b); if (cloud.on) showSync(); return b; }
    } catch (e) {}
    if (cloud.on) showSync();
  }
  if (FSA && dirHandle && await dirPerm(false)) {
    try {
      let file = s.rel ? await fileFromDir(s.rel).catch(() => null) : null;
      if (!file) {   // path changed (e.g. project made with another folder level): find the PDF by file name
        const hit = (await dirListCached()).find(e => e.name.toLowerCase() === (s.name || '').toLowerCase());
        if (hit) { s.rel = hit.rel; s.disk = true; file = await fileFromDir(hit.rel).catch(() => null); scheduleSave(); }
      }
      if (file) { const b = await file.arrayBuffer(); pdfBuffers.set(id, b); trimCache(id); return b; }
    } catch (e) {}
  }
  if (DESK && state.folder && state.folder.path && s.rel) {
    try { const b = await DESK.readFile(state.folder.path, s.rel); if (b) { pdfBuffers.set(id, b); trimCache(id); return b; } } catch (e) {}
  }
  return null;
}
// keep only a few disk-backed PDFs in memory
function trimCache(keep) {
  const disk = [...pdfBuffers.keys()].filter(k => srcById(k) && srcById(k).disk && k !== keep);
  while (disk.length > 6) { const k = disk.shift(); pdfBuffers.delete(k); pdfDocs.delete(k); }
}
function getDoc(id) {
  if (!pdfDocs.has(id)) {
    const buf = pdfBuffers.get(id);
    if (!buf) return Promise.reject(new Error('no pdf'));
    pdfDocs.set(id, pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise);
  }
  return pdfDocs.get(id);
}

async function renderViewer(keepRatio) {
  const token = ++renderToken;
  const ratio = keepRatio && viewer.scrollHeight ? viewer.scrollTop / viewer.scrollHeight : 0;
  if (observer) observer.disconnect();
  pagesEls = [];
  viewer.innerHTML = '';
  const id = state.activeSource;
  if (!id) { viewer.innerHTML = emptyViewerHtml(); $('#bAddPdf2').onclick = () => $('#fPdf').click(); $('#bFolder2').onclick = pickFolder; hideInfo(); return; }
  const buf0 = await loadBuffer(id);
  if (token !== renderToken) return;
  if (!buf0) {
    const s = srcById(id);
    const nl = state.links.filter(l => l.sourceId === id).length;
    viewer.innerHTML = `<div class="empty-state"><h3>📄 ${esc(s?.label)}</h3><div style="font-size:12px;margin-bottom:10px">${esc(s?.rel || s?.name || '')}${nl ? ` · ${nl} link${nl > 1 ? 's' : ''}` : ''}</div>This PDF is not on this device${state.folder ? ` (it lives in your folder “${esc(state.folder.name)}”)` : ''}. Links to it still work: the source, page and quote are shown for every highlighted phrase.<br><br>To view the PDF here, ${isMobile() ? 'choose the file' : 'link the folder with your PDFs (every source is matched by file name) or choose the file'}.<br><br>${isMobile() ? '' : '<button class="btn primary" id="bReFolder">📁 Link folder…</button> '}<button class="btn" id="bReatt">Choose this PDF…</button></div>`;

      if (!(await dirPerm(false))) viewer.querySelector('.empty-state').prepend(b);
    }

  }

  try { doc = await getDoc(id); } catch (e) { viewer.innerHTML = `<div class="empty-state"><h3>Could not open PDF</h3>${esc(e.message)}</div>`; return; }
  if (token !== renderToken) return;
  const p1 = await doc.getPage(1);
  if (token !== renderToken) return;
  const vp1 = p1.getViewport({ scale: calcScale(p1) });
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= doc.numPages; i++) {
    const el = document.createElement('div');
    el.className = 'pdfpage'; el.dataset.page = i;

function calcScale(page) {
  const base = page.getViewport({ scale: 1 });
  const avail = Math.max(200, viewer.clientWidth - 40);
  return Math.max(0.25, (avail / base.width) * state.zoom);

async function renderPage(el, token) {
  if (el._state) return;
  el._state = 'rendering';
  const gen = el._gen = (el._gen || 0) + 1;
  try {
    const doc = await getDoc(state.activeSource);
    const page = await doc.getPage(+el.dataset.page);
    if (token !== renderToken || gen !== el._gen) return;
    const vp = page.getViewport({ scale: calcScale(page) });
    el.style.width = vp.width + 'px'; el.style.height = vp.height + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
    el.insertBefore(canvas, el.firstChild);
    const task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined });
    el._task = task;
    const tl = document.createElement('div');
    tl.className = 'textLayer'; tl.style.setProperty('--scale-factor', vp.scale);
    el.appendChild(tl);
    const tc = await page.getTextContent();
    if (gen !== el._gen) return;
    if (!tc.items.some(it => it.str && it.str.trim()) && !areaMode && scanHinted !== state.activeSource) {
      scanHinted = state.activeSource;
      toast('This page is a scan: its text cannot be selected. Use ▭ Area to select a passage.');
    }
    await pdfjsLib.renderTextLayer({ textContentSource: tc, container: tl, viewport: vp }).promise;
    const eoc = document.createElement('div'); eoc.className = 'endOfContent'; tl.appendChild(eoc);

}
function unrenderPage(el) {

  el._gen = (el._gen || 0) + 1;
  try { el._task && el._task.cancel(); } catch (e) {}
  el.querySelectorAll('canvas,.textLayer').forEach(n => n.remove());
  el._state = null;
}

function drawHighlights() {
  pagesEls.forEach(el => { const h = el.querySelector('.hl-layer'); if (h) h.innerHTML = ''; });

function onPdfMouseUp(e) {
  if (areaMode || areaEdit) return;
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { hitTestHighlight(e); return; }
  const range = sel.getRangeAt(0);
  if (!viewer.contains(range.commonAncestorContainer)) return;
  const text = xmlSafe(sel.toString()).replace(/\s+/g, ' ').trim();
  if (!text) return;
  const rects = [];
  const rlist = [...range.getClientRects()];
  for (const cr of rlist) {
    if (cr.width < 1 || cr.height < 1) continue;
    const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    const pel = pagesEls.find(p => { const b = p.getBoundingClientRect(); return cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom; });
    if (!pel) continue;
    const b = pel.getBoundingClientRect();
    const r = { p: +pel.dataset.page, x: (cr.left - b.left) / b.width, y: (cr.top - b.top) / b.height, w: cr.width / b.width, h: cr.height / b.height };
    if (r.h > 0.08 || r.w > 0.98) continue; // container boxes, not text
    rects.push(r);
  }
  const merged = mergeRects(rects);
  if (!merged.length) return;
  pdfSel = { sourceId: state.activeSource, page: merged[0].p, quote: text, rects: merged };
  const last = rlist.filter(r => r.width > 0).pop() || range.getBoundingClientRect();
  offerPdfSel(last.right, last.bottom + 6, text, () => sel.removeAllRanges());
}
function offerPdfSel(px, py, text, clear) {
  const src = srcById(state.activeSource);
  const items = [];
  if (pending.articleLinkId) {
    items.push(['🔗 Link to the marked phrase', () => finishLink(pending.articleLinkId, pdfSel)]);
  } else {
    items.push(['📌 Use as source for a link', () => {
      pending.pdf = pdfSel; clear();
      if (isMobile()) setTab('art');
      showPending(`Passage from “${src.label}”, p. ${pdfSel.page} selected. Now select a phrase in the article.`);
    }]);
  }
  if (text) items.push(['📋 Copy quote', () => copyText(text)]);
  showPopup(px, py, items, text ? `“${text.slice(0, 80)}${text.length > 80 ? '…' : ''}”` : `▭ ${src.label}, ${PG[LANG]} ${pdfSel.page}`);
}

async function editArea(l) {

  if (l.sourceId !== state.activeSource) await openSource(l.sourceId);
  await scrollPdfTo(l);
  const r = { ...l.rects[0] }, pel = pagesEls[r.p - 1]; if (!pel) return;
  const box = document.createElement('div'); box.className = 'areaEdit';
  box.innerHTML = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(h => `<i data-h="${h}"></i>`).join('');
  pel.appendChild(box);
  const hide = document.createElement('style'); hide.textContent = `.hl[data-link="${l.id}"]{display:none}`; document.head.appendChild(hide);
  areaEdit = { l, r, pel, box, hide };
  const place = () => Object.assign(box.style, { left: r.x * 100 + '%', top: r.y * 100 + '%', width: r.w * 100 + '%', height: r.h * 100 + '%' });
  place();
  box.onpointerdown = e => {
    e.preventDefault(); e.stopPropagation(); box.setPointerCapture(e.pointerId);
    const h = e.target.dataset.h || 'move', b = pel.getBoundingClientRect(), s0 = { ...r }, sx = e.clientX, sy = e.clientY;
    box.onpointermove = ev => {
      const dx = (ev.clientX - sx) / b.width, dy = (ev.clientY - sy) / b.height, M = 0.01;

      if (h === 'move') { const mx = Math.max(-x1, Math.min(1 - x2, dx)), my = Math.max(-y1, Math.min(1 - y2, dy)); x1 += mx; x2 += mx; y1 += my; y2 += my; }
      else {
        if (h.includes('w')) x1 = Math.max(0, Math.min(x2 - M, x1 + dx));
        if (h.includes('e')) x2 = Math.min(1, Math.max(x1 + M, x2 + dx));
        if (h.includes('n')) y1 = Math.max(0, Math.min(y2 - M, y1 + dy));
        if (h.includes('s')) y2 = Math.min(1, Math.max(y1 + M, y2 + dy));

      Object.assign(r, { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }); place();
    };

  };

}

function mergeRects(rects) {
  rects.sort((a, b) => a.p - b.p || a.y - b.y || a.x - b.x);
  const out = [];
  for (const r of rects) {
    const last = out[out.length - 1];
    if (last && last.p === r.p) {
      const ov = Math.min(last.y + last.h, r.y + r.h) - Math.max(last.y, r.y);
      const near = r.x <= last.x + last.w + 0.02 && r.x + r.w >= last.x - 0.02;
      if (ov > 0.5 * Math.min(last.h, r.h) && near) {
        const x1 = Math.min(last.x, r.x), y1 = Math.min(last.y, r.y);
        const x2 = Math.max(last.x + last.w, r.x + r.w), y2 = Math.max(last.y + last.h, r.y + r.h);
        Object.assign(last, { x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
        continue;
      }
    }
    out.push({ ...r });
  }
  return out.map(r => ({ p: r.p, x: +r.x.toFixed(5), y: +r.y.toFixed(5), w: +r.w.toFixed(5), h: +r.h.toFixed(5) }));
}

function hitTestHighlight(e) {
  const pel = e.target.closest && e.target.closest('.pdfpage'); if (!pel) return;
  const b = pel.getBoundingClientRect();
  const x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height, p = +pel.dataset.page;
  const pad = 0.003;
  const hit = state.links.find(l => l.sourceId === state.activeSource &&
    l.rects.some(r => r.p === p && x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - pad && y <= r.y + r.h + pad));
  if (hit) activateLink(hit.id, { from: 'pdf' });
}

function wrapRange(range, id, cls, kind = 'cite') {
  let root = range.commonAncestorContainer; if (root.nodeType === 3) root = root.parentNode;
  const nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) { const n = w.currentNode; if (n.nodeValue.length && range.intersectsNode(n)) nodes.push(n); }
  const sc = range.startContainer, so = range.startOffset, ec = range.endContainer, eo = range.endOffset;
  const marks = [];
  for (const n of nodes) {
    const start = n === sc ? so : 0;
    const end = n === ec ? eo : n.nodeValue.length;
    if (end <= start) continue;
    let t = n;
    if (end < t.nodeValue.length) t.splitText(end);
    if (start > 0) t = t.splitText(start);
    if (!t.nodeValue.trim() && /^(UL|OL|TABLE|TBODY|THEAD|TR)$/.test(t.parentNode.nodeName)) continue;
    const m = document.createElement('mark');
    m.className = kind + (cls ? ' ' + cls : ''); if (kind === 'cite') m.dataset.link = id; else m.dataset.note = id;
    t.parentNode.insertBefore(m, t); m.appendChild(t);
    marks.push(m);
  }
  return marks;
}
function unwrapLink(id) {
  marksOf(id).forEach(m => m.replaceWith(...m.childNodes));
  editor.normalize();
}

function finishLink(articleId, sel) {
  if (!sel) return;
  const src = srcById(sel.sourceId);
  const link = { id: articleId, sourceId: sel.sourceId, page: sel.page, quote: sel.quote, rects: sel.rects, created: Date.now() };
  state.links = state.links.filter(l => l.id !== articleId);
  state.links.push(link);
  const ms = marksOf(articleId);
  ms.forEach(m => m.classList.remove('pending'));
  if (state.insertCite && src && ms.length) {
    ms[ms.length - 1].after(document.createTextNode(` (${src.label})`));
  }
  pending = { articleLinkId: null, pdf: null };
  hidePending(); hidePopup();
  getSelection().removeAllRanges();
  refreshMarks();
  activateLink(articleId, { noScrollPdf: true });
  scheduleSave();
  if (areaMode) setAreaMode(false);
  toast('Link created');
}

      if (m.classList.contains('pending') && m.dataset.link === pending.articleLinkId) return;
      const trashed = (state.trash || []).some(t => t.links.some(x => x.id === m.dataset.link));
      m.classList.add('orphan'); m.classList.toggle('trashed', trashed); m.title = trashed ? '' : 'Source deleted'; m.style.removeProperty('--c'); return;

/* undo / redo for removed links (the browser's own undo does not see them) */
const linkUndo = [], linkRedo = [];
const normHtml = h => String(h).replace(/ (class|style|title)="[^"]*"/g, '');
function pushLinkUndo(before, links) {
  linkUndo.push({ part: state.currentPart, before, after: editor.innerHTML, links });
  if (linkUndo.length > 30) linkUndo.shift();
  linkRedo.length = 0;
}
function tryLinkUndo(redo) {
  const st = redo ? linkRedo : linkUndo, e = st[st.length - 1];
  if (!e || e.part !== state.currentPart || normHtml(editor.innerHTML) !== normHtml(redo ? e.before : e.after)) return false;
  st.pop();
  if (!redo) {
    editor.innerHTML = e.before;
    e.links.forEach(l => { if (!linkById(l.id)) state.links.push(l); });
    linkRedo.push(e); toast(e.links.length > 1 ? 'Links restored' : 'Link restored');
  } else {
    editor.innerHTML = e.after;
    const ids = e.links.map(l => l.id);
    state.links = state.links.filter(l => !ids.includes(l.id));
    if (ids.includes(state.activeLink)) { state.activeLink = null; hideInfo(); }
    linkUndo.push(e);
  }
  layoutPages && layoutPages();
  refreshMarks(); drawHighlights(); scheduleSave();
  return true;
}
editor.addEventListener('input', () => { linkRedo.length = 0; });
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase(), redo = k === 'y' || (k === 'z' && e.shiftKey), undo = k === 'z' && !e.shiftKey;
  if (!undo && !redo) return;
  const t = e.target; if (t !== editor && !editor.contains(t) && t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
  if (tryLinkUndo(redo)) e.preventDefault();
}, true);

async function removeLinks(ids) {
  const ok = await modal({ title: ids.length === 1 ? 'Remove link?' : `Remove ${ids.length} links?`, body: 'The article text stays; only the connection to the source is removed.', okText: 'Remove', danger: true });
  if (!ok) return;
  const before = editor.innerHTML, gone = state.links.filter(l => ids.includes(l.id));
  ids.forEach(unwrapLink);
  state.links = state.links.filter(l => !ids.includes(l.id));
  pushLinkUndo(before, gone);
  if (ids.includes(state.activeLink)) { state.activeLink = null; hideInfo(); }
  getSelection().removeAllRanges();
  refreshMarks(); drawHighlights(); scheduleSave();
}
async function deleteLink(id) {
  const ok = await modal({ title: 'Remove link?', body: 'The article text stays; only the connection to the source is removed.', okText: 'Remove', danger: true });

  const before = editor.innerHTML, gone = state.links.filter(l => l.id === id);

editor.addEventListener('beforeinput', e => {
  if (e.inputType !== 'insertText' || !e.data) return;
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;
  const n = s.anchorNode, off = s.anchorOffset;
  if (!n || n.nodeType !== 3) return;
  const m = n.parentElement && n.parentElement.closest('mark.cite, mark.note'); if (!m || !editor.contains(m)) return;
  const texts = []; const w = document.createTreeWalker(m, NodeFilter.SHOW_TEXT); while (w.nextNode()) texts.push(w.currentNode);
  const atEnd = off === n.nodeValue.length && texts[texts.length - 1] === n;
  const atStart = off === 0 && texts[0] === n;
  if (!atEnd && !atStart) return;
  e.preventDefault();
  let t;
  const sib = atEnd ? m.nextSibling : m.previousSibling;
  if (sib && sib.nodeType === 3) {
    if (atEnd) { sib.insertData(0, e.data); t = sib; setCaret(t, e.data.length); }
    else { sib.appendData(e.data); t = sib; setCaret(t, t.nodeValue.length); }
  } else {
    t = document.createTextNode(e.data); atEnd ? m.after(t) : m.before(t); setCaret(t, e.data.length);
  }
  updateEmpty(); scheduleSave();
});

const ALLOWED = new Set(['P','BR','B','STRONG','I','EM','U','SUP','SUB','H1','H2','H3','H4','UL','OL','LI','TABLE','THEAD','TBODY','TR','TD','TH','IMG','MARK','BLOCKQUOTE']);
const DROP = new Set(['SCRIPT','STYLE','META','LINK','TITLE','HEAD','XML','IFRAME','OBJECT','EMBED','SVG','BUTTON','INPUT','TEXTAREA','SELECT','NOSCRIPT']);
function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const walk = node => {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 8) { ch.remove(); continue; }
      if (ch.nodeType !== 1) continue;
      const tag = ch.tagName.toUpperCase();
      if (DROP.has(tag) || tag.includes(':') && /^(O|W|V):/.test(tag) && !ch.textContent.trim()) { ch.remove(); continue; }
      walk(ch);
      if (tag === 'MARK') {
        if (!(ch.classList.contains('cite') && linkById(ch.dataset.link))) { ch.replaceWith(...ch.childNodes); continue; }
        const id = ch.dataset.link; for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
        ch.className = 'cite'; ch.dataset.link = id; continue;
      }
      if (tag === 'SPAN' || tag === 'FONT') {
        const st = (ch.getAttribute('style') || '').toLowerCase();
        let wrapTag = null;
        if (/font-weight:\s*(bold|[6-9]00)/.test(st)) wrapTag = 'b';
        else if (/font-style:\s*italic/.test(st)) wrapTag = 'i';
        if (wrapTag) { const nn = doc.createElement(wrapTag); nn.append(...ch.childNodes); ch.replaceWith(nn); }
        else ch.replaceWith(...ch.childNodes);
        continue;
      }
      if (tag === 'DIV') { const p = doc.createElement('p'); p.append(...ch.childNodes); ch.replaceWith(p); continue; }
      if (!ALLOWED.has(tag)) { ch.replaceWith(...ch.childNodes); continue; }
      const keep = {};
      if (tag === 'IMG' && /^data:image\//.test(ch.getAttribute('src') || '')) keep.src = ch.getAttribute('src');
      if ((tag === 'TD' || tag === 'TH') && ch.getAttribute('colspan')) keep.colspan = ch.getAttribute('colspan');
      const align = ch.style && ch.style.textAlign;
      for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
      for (const k in keep) ch.setAttribute(k, keep[k]);
      if (align && /^(P|H1|H2|H3|H4)$/.test(tag)) ch.style.textAlign = align;
      if (tag === 'IMG' && !keep.src) ch.remove();
    }
  };
  walk(doc.body);
  return doc.body.innerHTML;
}

// Word files are AWBO's own format: Open / Save / Save as
let fileHandle = null;   // the .docx that Save writes back to (Chrome/Edge outside claude.ai)
const DOCX_TYPE = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const canPickFiles = () => FSA && 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;
$('#bOpen').onclick = async () => {
  storeCurrentPart();
  const hasText = state.parts.some(p => p.title || partWords(p.html));
  let add = false;
  if (hasText) {
    const r = await modal({ title: 'Open file?', body: 'The current article will be replaced by the file. Save it first if you need it.' + `<label><input type="checkbox" name="add"> <span>Add to the current article as new parts instead of replacing it</span></label>`, okText: 'Open' });
    if (!r) return; add = !!r.add;
  }
  openOpts = { add };
  if (canPickFiles()) {
    try {
      const [h] = await window.showOpenFilePicker({ id: 'awbo-docs', types: [{ description: 'Word / AWBO', accept: { [DOCX_TYPE]: ['.docx'], 'application/json': ['.json'] } }] });
      const f = await h.getFile();
      if (/\.docx$/i.test(f.name) && !add) { fileHandle = h; idbPut('kv', 'fileHandle', h); }
      await openFile(f);
    } catch (e) {}
    return;
  }
  $('#fDocx').click();
};
let openOpts = { add: false };
$('#fDocx').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!openOpts.add) { fileHandle = null; idbDel('kv', 'fileHandle'); }
  await openFile(f);
};
async function openFile(f) {
  if (/\.json$/i.test(f.name)) return openJsonFile(f);
  storeCurrentPart();
  const add = openOpts.add && state.parts.some(p => p.title || partWords(p.html));
  try {
    setStatus('Importing…');
    const read = await readDocxWithComments(await f.arrayBuffer());
    const html = sanitizeHtml(read.html) || '<p><br></p>';
    const base = f.name.replace(/\.docx$/i, '');
    const known = read.data && read.data.parts && read.data.parts.length ? read.data.parts : null;
    let newParts = known ? splitByKnownParts(html, known) : splitIntoParts(html, add ? base : '');
    if (known && newParts.length === 1) {
      // saved as one part, but the text has headings: offer to split them again
      const alt = splitIntoParts(html, add ? base : '');
      if (alt.length > 1) {
        setStatus('');
        const split = await modal({ title: 'Split into parts?', body: `The document has ${alt.length} headings. Each heading can start its own part, or the whole document can stay as one part (headings stay in the text).`, okText: 'Split into parts', cancelText: 'Keep as one part' });
        if (split) newParts = alt;
        setStatus('Importing…');
      }
    } else if (newParts.length > 1) {
      setStatus('');
      const split = await modal(known
        ? { title: 'Split into parts?', body: `The file is saved in ${newParts.length} parts. Keep them, or open the whole document as one part (part titles stay in the text as headings).`, okText: 'Keep the parts', cancelText: 'Keep as one part' }
        : { title: 'Split into parts?', body: `The document has ${newParts.length} headings. Each heading can start its own part, or the whole document can stay as one part (headings stay in the text).`, okText: 'Split into parts', cancelText: 'Keep as one part' });
      if (!split) newParts = [{ id: uid('P'), title: add ? base : '', html }];
      setStatus('Importing…');
    }
    if (!add) {
      state.parts = newParts; state.links = []; state.notes = []; state.trash = [];
      applyDocSettings(read.data);
      state.title = (read.data && read.data.title) || base; $('#title').value = state.title;
    } else {
      const cur = partById(state.currentPart);
      let i = state.parts.indexOf(cur);
      if (cur && !cur.title && !partWords(cur.html)) { state.parts.splice(i, 1); i--; }
      state.parts.splice(i + 1, 0, ...newParts);
      if (read.data) for (const m of read.data.sources || []) sourceFor(m);
    }
    const got = restoreComments(newParts, read.comments);
    openPart(newParts[0].id, { noStore: true });
    refreshMarks(); drawHighlights(); hideInfo(); renderNoteList(); renderSourceBar(); renderLibrary(); scheduleSave();
    savedRev = editRev;
    toast(got.links || got.notes ? `Document imported: ${got.links} links, ${got.notes} notes` : 'Document imported');
    if (!state.activeSource && state.sources[0]) openSource(state.sources[0].id);
  } catch (err) { console.error(err); toast('Could not read the .docx'); setStatus(''); }
}
async function openJsonFile(f) {
  let data;
  try { data = JSON.parse(await f.text()); if (data.app !== 'citelink') throw 0; }
  catch (err) { toast('This is not an AWBO project file'); return; }
  for (const s of data.sources || []) {
    if (s.data) { const buf = b64ToBuf(s.data); pdfBuffers.set(s.id, buf); await idbPut('pdfs', s.id, buf); s.disk = false; }
    delete s.data;
  }
  fileHandle = null; idbDel('kv', 'fileHandle');
  applyProject(data);
  scheduleSave();
  toast('Project opened');
}

let editRev = 0, savedRev = 0;

async function saveDocx(asNew) {
  const def = { comments: true, notes: true, titles: true, newPage: false };
  let opts = { ...def, ...(state.saveOpts || {}) };
  if (asNew) {
    const r = await modal({ title: 'Save as Word', body: `<label><input type="checkbox" name="comments" ${opts.comments ? 'checked' : ''}> <span>Add sources as <b>comments</b> on the phrases (label, page and quote)</span></label>`
      + `<label><input type="checkbox" name="notes" ${opts.notes ? 'checked' : ''}> <span>Include my personal notes as Word comments</span></label>`
      + (state.parts.length > 1 ? `<label><input type="checkbox" name="newPage" ${opts.newPage ? 'checked' : ''}> <span>Start each part on a new page</span></label>` : '')
      + (state.parts.length > 1 ? `<label><input type="checkbox" name="only"> <span>Only the current part (saved as a separate copy)</span></label>` : ''), okText: 'Save' });
    if (!r) return;
    opts = { comments: !!r.comments, notes: !!r.notes, titles: true, newPage: !!r.newPage };
    state.saveOpts = opts; scheduleSave();
    if (r.only) return savePartCopy(opts);
  }
  let blob;
  try { setStatus('Preparing .docx…'); blob = await buildDocx({ ...opts, only: false }); }
  catch (err) { console.error(err); toast('Export error: ' + err.message); return; }
  const name = safeName(state.title || 'article') + '.docx';
  if (canPickFiles()) {
    try {
      let h = !asNew && fileHandle ? fileHandle : await window.showSaveFilePicker({ id: 'awbo-docs', suggestedName: name, types: [{ description: 'Word', accept: { [DOCX_TYPE]: ['.docx'] } }] });
      if ((await h.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('denied');
      const w = await h.createWritable(); await w.write(blob); await w.close();
      fileHandle = h; idbPut('kv', 'fileHandle', h); savedRev = editRev;
      toast('File saved'); setStatus('Saved · ' + wordCount());
      return;
    } catch (e) { if (e && e.name === 'AbortError') { setStatus(''); return; } }
  }
  await saveFile(name, blob); savedRev = editRev;

/* ---------------- cloud sync (claude.ai storage, web version only) ---------------- */
const cloud = { on: false, db: null, assets: null, uid: null, rev: null, dirty: false, pushing: false, again: false, applying: false, timer: null, usage: null, usageAt: 0, state: '' };
cloud.device = (() => { try { let d = localStorage.getItem('awbo-device'); if (!d) { d = uid('D'); localStorage.setItem('awbo-device', d); } return d; } catch (e) { return uid('D'); } })();
const CHUNK = 60000;
const fmtMB = b => (b / 1048576 >= 1024 ? (b / 1073741824).toFixed(1) + ' GB' : Math.round(b / 1048576) + ' MB');
const cRoot = () => 'data/users/' + cloud.uid;
async function saveSyncState() { await idbPut('kv', 'sync', { rev: cloud.rev, dirty: cloud.dirty, updatedAt: localUpdatedAt }); }
function setSync(st) { cloud.state = st; showSync(); }
function showSync() {
  const map = { connecting: ['☁', 'Connecting to cloud…', '#999'], synced: ['☁', 'Synced', '#2f8a4f'], syncing: ['☁', 'Syncing…', '#c99a1a'], offline: ['☁', 'Offline — changes are kept on this device and will sync later', '#b4532a'], full: ['☁', 'Cloud storage is full', '#b4532a'] };
  const m = map[cloud.state] || map.connecting;
  const b = $('#cloudBadge'); b.classList.add('on'); b.textContent = m[0]; b.style.color = m[2]; b.title = m[1];
  const txt = cloud.state === 'synced' ? '☁ Synced' : cloud.state === 'syncing' ? '☁ Syncing…' : cloud.state === 'offline' ? '☁ Offline — will sync later' : cloud.state === 'full' ? '☁ Cloud storage full' : '☁ Connecting…';
  $('#status').textContent = txt + ' · ' + wordCount();
}
function schedulePush(delay = 3000) { clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudPush, delay); setSync('syncing'); }
const hasContent = () => { storeCurrentPart(); return !!(state.sources.length || state.parts.some(p => p.title || partWords(p.html))); };

async function uploadPendingPdfs() {
  if (!cloud.assets) return;
  if (!state.cloudPdfs) return;
  const todo = state.sources.filter(s => !s.asset && !s.tooBig);
  let i = 0;
  for (const s of todo) {
    i++;
    const buf = await loadBuffer(s.id); if (!buf) continue;
    if (buf.byteLength > 20 * 1048576) { s.tooBig = true; continue; }
    $('#status').textContent = `☁ Uploading PDFs ${i}/${todo.length}…`;
    try { const r = await cloud.assets.upload(new Blob([buf], { type: 'application/pdf' }), { type: 'application/pdf' }); s.asset = r.id; }
    catch (e) { if (e && e.code === 'quota_or_state') { setSync('full'); toast('Cloud storage is full — some PDFs stay on this device only'); return; } if (e && e.code === 'too_large') s.tooBig = true; }
  }
  if (todo.length) renderLibrary();
}

async function cloudPush() {
  if (!cloud.on) return;
  if (cloud.pushing) { cloud.again = true; return; }
  cloud.pushing = true; setSync('syncing');
  try {
    await uploadPendingPdfs();
    const data = projectData(); data.updatedAt = localUpdatedAt || Date.now(); delete data.activeSource;
    const json = JSON.stringify(data);
    const rev = uid('R'), n = Math.max(1, Math.ceil(json.length / CHUNK));
    for (let i = 0; i < n; i++) await cloud.db.doc(`${cRoot()}/project/chunks/c${i}`).set({ rev, i, s: json.slice(i * CHUNK, (i + 1) * CHUNK) });
    await cloud.db.doc(`${cRoot()}/project`).set({ rev, n, updatedAt: data.updatedAt, device: cloud.device });
    cloud.rev = rev; if (!cloud.again) cloud.dirty = false;
    await saveSyncState(); await idbPut('kv', 'project', projectData());
    setSync(cloud.state === 'full' ? 'full' : 'synced');
  } catch (e) {
    setSync(e && e.code === 'quota_exceeded' ? 'full' : 'offline');
    clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudPush, 30000);
  } finally {
    cloud.pushing = false;
    if (cloud.again) { cloud.again = false; schedulePush(1000); }
  }
}

async function cloudPull(m) {
  setSync('syncing');
  try {
    const parts = [];
    for (let i = 0; i < m.n; i++) {
      const sn = await cloud.db.doc(`${cRoot()}/project/chunks/c${i}`).get();
      const d = sn.exists ? sn.data() : null;
      if (!d || d.rev !== m.rev) { setTimeout(async () => { const s2 = await cloud.db.doc(`${cRoot()}/project`).get().catch(() => null); if (s2 && s2.exists && s2.data().rev !== cloud.rev) cloudPull(s2.data()); }, 3000); return false; }
      parts.push(d.s);
    }
    const data = JSON.parse(parts.join(''));
    const scroll = $('#edScroll').scrollTop, keep = state.activeSource;
    cloud.applying = true;
    data.activeSource = (data.sources || []).some(x => x.id === keep) ? keep : null;
    applyProject(data, { soft: true, keepPart: state.currentPart });
    $('#edScroll').scrollTop = scroll;
    cloud.applying = false;
    localUpdatedAt = data.updatedAt || Date.now();
    cloud.rev = m.rev; cloud.dirty = false;
    await idbPut('kv', 'project', projectData()); await saveSyncState();
    setSync('synced');
    return true;
  } catch (e) { cloud.applying = false; setSync('offline'); return false; }
}

function onRemote(m) {
  if (m.rev === cloud.rev || m.device === cloud.device) return;
  if (cloud.dirty && (m.updatedAt || 0) <= localUpdatedAt) { schedulePush(500); return; } // ours is newer
  if (document.activeElement === editor && Date.now() - localUpdatedAt < 4000) { setTimeout(() => onRemote(m), 4000); return; } // don't yank text while typing
  cloudPull(m).then(ok => { if (ok) toast('Updated from your other device'); });
}

async function cloudInit() {
  if (DESK || !window.claude || typeof window.claude.use !== 'function') return;
  let db = null, user = null, assets = null;
  try { [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]); } catch (e) { return; }
  if (!db || !user) return;
  let id = null; try { id = await user.id(); } catch (e) {}
  if (!id) return;
  Object.assign(cloud, { db, assets, uid: id, on: true });
  const ss = await idbGet('kv', 'sync');
  if (ss) { cloud.rev = ss.rev || null; cloud.dirty = !!ss.dirty; localUpdatedAt = ss.updatedAt || 0; }
  setSync('connecting');
  let man = null;
  try { const sn = await db.doc(`${cRoot()}/project`).get(); man = sn.exists ? sn.data() : null; }
  catch (e) { setSync('offline'); }
  if (!man) { if (hasContent()) await cloudPush(); else setSync('synced'); }
  else if (man.rev === cloud.rev) { if (cloud.dirty) await cloudPush(); else setSync('synced'); }
  else if (!cloud.rev && hasContent()) {
    const r = await modal({ title: 'Your project is in the cloud', body: 'This device has its own project, and a different one is already synced in the cloud from another device. Which one do you want to keep everywhere?', okText: 'Use the cloud version', cancelText: 'Keep this device’s version' });
    if (r) await cloudPull(man); else await cloudPush();
  }
  else if (cloud.dirty && (man.updatedAt || 0) < localUpdatedAt) await cloudPush();
  else await cloudPull(man);
  db.doc(`${cRoot()}/project`).onSnapshot(sn => { if (sn.exists && !sn.metadata.hasPendingWrites) onRemote(sn.data()); }, () => setSync('offline'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && cloud.dirty) { clearTimeout(cloud.timer); cloudPush(); } });
  renderLibrary();

    setStatus(idb ? 'Restored from browser · ' + wordCount() : '');
  } else {
    applyProject({ title: '', html: '<p><br></p>', sources: [], links: [] });
    setStatus(idb ? 'Autosave in browser is on' : 'Autosave unavailable — save the project to a file');
  }
  cloudInit();
})();
})();
</script>
</body>
